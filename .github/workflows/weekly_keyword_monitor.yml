name: Weekly GSC Keyword Performance Monitor

on:
  schedule:
    # 매주 월요일 00:00 UTC (한국 시간 매주 월요일 오전 09:00 KST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-gsc-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor-keywords:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth requests

      - name: Run GSC Keyword Monitor Script
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python gsc_keyword_monitor.py

      - name: Commit and Push Weekly Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "chore(report): archive weekly GSC keyword analytics" || echo "No changes to commit"
          git push origin main || echo "Push skipped or up-to-date"
