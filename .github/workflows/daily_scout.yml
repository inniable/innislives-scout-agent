name: Daily Blog Topic Scout Agent

on:
  schedule:
    # 이중 백업 크론 (1차: 06:17 KST / 2차 백업: 07:47 KST — 당일 이미 발행된 경우 자동 스킵)
    - cron: '17 21 * * *'
    - cron: '47 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scout-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check if Today's Briefing Already Exists (Prevent Duplicate on Backup Cron)
        id: check_dup
        run: |
          TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "ideas/${TODAY}-topics.md" ]; then
            echo "Today's briefing (ideas/${TODAY}-topics.md) already exists. Skipping backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.check_dup.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        if: steps.check_dup.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run Topic Scout Agent
        if: steps.check_dup.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scout_agent.py

      - name: Commit Daily Topic Report to ideas/
        if: steps.check_dup.outputs.skip != 'true'
        run: |
          TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          git config user.name "innislives-scout-agent"
          git config user.email "scout@innislives.tech"
          git add ideas/
          git diff --cached --quiet || (git commit -m "chore(scout): add daily topic briefing ($TODAY)" && git push origin main)

      - name: Publish Briefing as GitHub Issue
        if: steps.check_dup.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const now = new Date(Date.now() + 9 * 60 * 60 * 1000);
            const today = now.toISOString().slice(0, 10);
            const filePath = `ideas/${today}-topics.md`;
            if (!fs.existsSync(filePath)) return;
            const body = fs.readFileSync(filePath, 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[글감 브리핑] ${today} 오늘의 innislives 추천 블로그 주제 TOP 5`,
              body: body.slice(0, 60000),
            });
