name: Daily Blog Topic Scout Agent

on:
  schedule:
    # 3중 조기 백업 크론 (GitHub Actions 무료 플랜의 4~8시간 큐 지연을 흡수하기 위해 KST 자정 직후부터 배치)
    # 1차: 00:23 KST (15:23 UTC) / 2차: 03:37 KST (18:37 UTC) / 3차: 06:41 KST (21:41 UTC)
    # 당일 파일(ideas/YYYY-MM-DD-topics.md)이 이미 생성된 경우 자동 스킵되어 중복 실행 0%
    - cron: '23 15 * * *'
    - cron: '37 18 * * *'
    - cron: '41 21 * * *'
  workflow_dispatch:

concurrency:
  group: daily-blog-topic-scout
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  scout-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check if Today's Briefing Already Exists (Prevent Duplicate on Backup Cron)
        id: check_dup
        run: |
          TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "ideas/${TODAY}-topics.md" ]; then
            echo "Today's briefing (ideas/${TODAY}-topics.md) already exists. Skipping backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.check_dup.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        if: steps.check_dup.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run Topic Scout Agent
        if: steps.check_dup.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scout_agent.py

      - name: Commit Daily Topic Report to ideas/
        if: steps.check_dup.outputs.skip != 'true'
        run: |
          TODAY=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          git config user.name "innislives-scout-agent"
          git config user.email "scout@innislives.tech"
          git add ideas/
          git diff --cached --quiet || (git commit -m "chore(scout): add daily topic briefing ($TODAY)" && git pull --rebase origin main && git push origin main)

      - name: Publish Briefing as GitHub Issue
        if: steps.check_dup.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const now = new Date(Date.now() + 9 * 60 * 60 * 1000);
            const today = now.toISOString().slice(0, 10);
            const filePath = `ideas/${today}-topics.md`;
            if (!fs.existsSync(filePath)) return;
            const body = fs.readFileSync(filePath, 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[글감 브리핑] ${today} 오늘의 innislives 추천 블로그 주제 TOP 5`,
              body: body.slice(0, 60000),
            });
